<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f6f8fa;
    }
    .search-container {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    input[type="text"] {
      flex: 1;
      padding: 8px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #0969da;
      box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.3);
    }
    button {
      padding: 8px 12px;
      background-color: #2da44e;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover {
      background-color: #2c974b;
    }
    .settings-toggle {
      font-size: 12px;
      color: #656d76;
      cursor: pointer;
      text-align: right;
      user-select: none;
    }
    .settings-toggle:hover {
      color: #0969da;
      text-decoration: underline;
    }
    .settings-area {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #d0d7de;
    }
    .settings-area.open {
      display: block;
    }
    .settings-area label {
      font-size: 12px;
      color: #24292f;
      display: block;
      margin-bottom: 5px;
    }
    .settings-area input {
      width: 100%;
      box-sizing: border-box;
      font-size: 12px;
    }
    .error-msg {
      margin-top: 8px;
      font-size: 12px;
      color: #cf222e;
    }
  </style>
</head>
<body>

  <div class="search-container">
    <input type="text" id="searchInput" data-i18n-placeholder="searchPlaceholder" autofocus>
    <button id="searchBtn" data-i18n="searchButton">搜索</button>
  </div>

  <div class="settings-toggle" id="settingsToggle" data-i18n="settingsToggle">⚙️ 配置搜索方式</div>

  <div class="settings-area" id="settingsArea">
    <label for="urlTemplate" data-i18n="urlTemplateLabel">搜索 URL 模板（使用 %s 代表关键词）：</label>
    <input type="text" id="urlTemplate" data-i18n-placeholder="urlTemplatePlaceholder">
    <button id="saveBtn" style="margin-top: 8px; width: 100%; background-color: #0969da;" data-i18n="saveButton">保存配置</button>
    <div class="error-msg" id="errorMsg" hidden></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
