name: Deploy Privacy Page

on:
  push:
    branches: [ "main" ]
    paths:
      - "docs/privacy.html"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1. 构建并上传 Artifact
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs  # 你的静态文件目录

  # 2. 部署 Artifact 到 GitHub Pages
  deploy:
    needs: build  # 关键：确保在 build job 成功完成后才运行
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4